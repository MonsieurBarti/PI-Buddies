pre-commit:
  parallel: true
  commands:
    biome-check:
      run: npx @biomejs/biome check --staged --files-ignore-unknown=true
    test:
      run: npm test

pre-push:
  parallel: true
  commands:
    biome-check:
      run: npx @biomejs/biome check --files-ignore-unknown=true
    test:
      run: npm test
    build:
      run: npm run build